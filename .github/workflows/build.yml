name: Build DAroom

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CMake
        run: brew install cmake ninja
      - name: Configure (universal x86_64 + arm64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - name: Build VST3, AU and Standalone
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 3 2>&1 | tee build-log.txt
      - name: Post build log to PR on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "\`\`\`"; echo "macOS build log tail:"; tail -n 100 build-log.txt || true; echo "\`\`\`"; } > log-tail.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file log-tail.txt || true
      - name: Ad-hoc code sign bundles
        run: |
          for bundle in \
            "build/DAroom_artefacts/Release/VST3/DAroom.vst3" \
            "build/DAroom_artefacts/Release/AU/DAroom.component" \
            "build/DAroom_artefacts/Release/Standalone/DAroom.app"; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle" || true
              codesign --verify --deep --strict --verbose=2 "$bundle" || true
            fi
          done
      - name: Validate AU with auval
        continue-on-error: true
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/DAroom_artefacts/Release/AU/DAroom.component "$HOME/Library/Audio/Plug-Ins/Components/"
          auval -v aufx DArm DrAm
      - name: Package macOS plugins
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          cd build/DAroom_artefacts/Release
          /usr/bin/zip -rq DAroom-macOS-VST3-AU.zip VST3 AU Standalone
      - name: Create GitHub release with macOS binaries
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/DAroom_artefacts/Release
          gh release create "v1.2.0-build${GITHUB_RUN_NUMBER}" DAroom-macOS-VST3-AU.zip \
            --title "DAroom 1.2.0 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Universal (Intel + Apple Silicon) VST3, AU and Standalone builds, ad-hoc signed. auval result in the run log." \
            --target "$GITHUB_SHA"
      - name: Upload macOS plugins
        uses: actions/upload-artifact@v4
        with:
          name: DAroom-macOS-VST3-AU
          path: |
            build/DAroom_artefacts/Release/VST3/**
            build/DAroom_artefacts/Release/AU/**
            build/DAroom_artefacts/Release/Standalone/**

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build-log.txt
      - name: Post build log to PR on failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "\`\`\`"; echo "Windows build log tail:"; tail -n 100 build-log.txt || true; echo "\`\`\`"; } > log-tail.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file log-tail.txt || true
      - name: Package Windows plugins
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          cd build/DAroom_artefacts/Release
          powershell -NoProfile -Command "Compress-Archive -Path VST3, Standalone -DestinationPath DAroom-Windows-VST3-Standalone.zip"
      - name: Attach Windows zip to the run's release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0-build${GITHUB_RUN_NUMBER}"
          for i in $(seq 1 80); do
            gh release view "$TAG" --repo drdrillcontacts-svg/DARoom > /dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "$TAG" build/DAroom_artefacts/Release/DAroom-Windows-VST3-Standalone.zip --clobber --repo drdrillcontacts-svg/DARoom
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: DAroom-Windows-VST3-Standalone
          path: |
            build/DAroom_artefacts/Release/VST3/**
            build/DAroom_artefacts/Release/Standalone/**
